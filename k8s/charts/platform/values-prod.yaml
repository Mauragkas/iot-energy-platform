# values-prod.yaml: Production environment profile
# Multi-replica microservices, pod anti-affinity, strict resource guarantees, 50Gi persistent storage.

replicaCount: 3

persistence:
  enabled: true
  storageClass: standard
  size: 50Gi

ingestor:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPU: 70
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - ingestor-rs
            topologyKey: "kubernetes.io/hostname"

