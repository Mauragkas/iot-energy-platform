---
# Mosquitto Headless Service
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: mqtt-broker
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: None
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
  selector:
    app.kubernetes.io/name: mosquitto
---
# Mosquitto NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-service
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: mqtt-broker
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: NodePort
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: {{ .Values.mosquitto.nodePort | default 31883 }}
  selector:
    app.kubernetes.io/name: mosquitto
---
