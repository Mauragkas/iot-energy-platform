# TimescaleDB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescaledb
  labels:
    app.kubernetes.io/name: timescaledb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: timescaledb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: timescaledb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timescaledb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    spec:
      containers:
        - name: timescaledb
          image: "{{ .Values.timescaledb.image.repository }}:{{ .Values.timescaledb.image.tag }}"
          imagePullPolicy: {{ .Values.timescaledb.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: iot-platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-platform-secrets
                  key: postgres_password
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: iot-platform-config
                  key: TIMESCALE_DB
            - name: PGDATA
              value: /home/postgres/pgdata/data
          volumeMounts:
            - name: timescale-data
              mountPath: /home/postgres/pgdata/data
            - name: timescale-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d iot_energy -h 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d iot_energy -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
      volumes:
        {{- if not .Values.timescaledb.persistence.enabled }}
        - name: timescale-data
          emptyDir: {}
        {{- end }}
        - name: timescale-init
          configMap:
            name: timescaledb-init
  {{- if .Values.timescaledb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: timescale-data
        labels:
          app.kubernetes.io/name: timescaledb
          app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.timescaledb.persistence.storageClass }}
        storageClassName: {{ .Values.timescaledb.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.timescaledb.persistence.size | quote }}
  {{- end }}
---
# Apache Kafka (KRaft Mode) StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: message-broker
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: message-broker
        app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 29093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:29093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kafka-topics --bootstrap-server 127.0.0.1:9092 --list
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - kafka-topics --bootstrap-server 127.0.0.1:9092 --list
            initialDelaySeconds: 35
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
      {{- if not .Values.kafka.persistence.enabled }}
      volumes:
        - name: kafka-data
          emptyDir: {}
      {{- end }}
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.kafka.persistence.storageClass }}
        storageClassName: {{ .Values.kafka.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size | quote }}
  {{- end }}
---
{{- if .Values.kafka.initTopics.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  labels:
    app.kubernetes.io/name: kafka-init-topics
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init-topics
        app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-init
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kafka broker to accept connections..."
              until kafka-topics --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
                sleep 2
              done
              echo "Creating platform topics..."
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.telemetry.raw --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic iot.alerts --partitions 3 --replication-factor 1
              echo "Topics initialized successfully:"
              kafka-topics --bootstrap-server kafka:9092 --list
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
{{- end }}
---
# MongoDB StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iot-platform-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-platform-secrets
                  key: mongo_password
            - name: MONGO_INITDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: iot-platform-config
                  key: MONGO_DB
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mongosh --eval 'db.runCommand("ping").ok' localhost:27017/test --quiet
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mongosh --eval 'db.runCommand("ping").ok' localhost:27017/test --quiet
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
      volumes:
        {{- if not .Values.mongo.persistence.enabled }}
        - name: mongo-data
          emptyDir: {}
        {{- end }}
        - name: mongo-init
          configMap:
            name: mongo-init
  {{- if .Values.mongo.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          app.kubernetes.io/name: mongo
          app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.mongo.persistence.storageClass }}
        storageClassName: {{ .Values.mongo.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.persistence.size | quote }}
  {{- end }}
---
# Eclipse Mosquitto StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosquitto
  labels:
    app.kubernetes.io/name: mosquitto
    app.kubernetes.io/component: mqtt-broker
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: mosquitto
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        app.kubernetes.io/component: mqtt-broker
        app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    spec:
      containers:
        - name: mosquitto
          image: "{{ .Values.mosquitto.image.repository }}:{{ .Values.mosquitto.image.tag }}"
          imagePullPolicy: {{ .Values.mosquitto.image.pullPolicy }}
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: mosquitto-data
              mountPath: /mosquitto/data
            - name: mosquitto-config-volume
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.mosquitto.resources | nindent 12 }}
      volumes:
        {{- if not .Values.mosquitto.persistence.enabled }}
        - name: mosquitto-data
          emptyDir: {}
        {{- end }}
        - name: mosquitto-config-volume
          configMap:
            name: mosquitto-config
  {{- if .Values.mosquitto.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: mosquitto-data
        labels:
          app.kubernetes.io/name: mosquitto
          app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.mosquitto.persistence.storageClass }}
        storageClassName: {{ .Values.mosquitto.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mosquitto.persistence.size | quote }}
  {{- end }}
