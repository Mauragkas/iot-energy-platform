apiVersion: v1
kind: Secret
metadata:
  name: iot-platform-secrets
  labels:
    app.kubernetes.io/name: iot-platform-secrets
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  postgres_password: {{ .Values.secrets.postgresPassword | quote }}
  mongo_password: {{ .Values.secrets.mongoPassword | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  DATABASE_URL: "postgres://{{ .Values.secrets.postgresUser }}:{{ .Values.secrets.postgresPassword }}@{{ .Values.config.timescaleHost }}:{{ .Values.config.timescalePort }}/{{ .Values.secrets.postgresDb }}"
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.secrets.mongoInitRootUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.secrets.mongoInitRootPassword | quote }}
  MONGO_USER: {{ .Values.secrets.mongoUser | quote }}
  MONGO_PASSWORD: {{ .Values.secrets.mongoPassword | quote }}
  MONGO_DB: {{ .Values.secrets.mongoDb | quote }}
  MONGO_URI: "mongodb://{{ .Values.secrets.mongoUser }}:{{ .Values.secrets.mongoPassword }}@{{ .Values.config.mongoHost }}:{{ .Values.config.mongoPort }}/{{ .Values.secrets.mongoDb }}?authSource=admin"
