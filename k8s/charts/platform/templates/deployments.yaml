# Ingestion Bridge: ingestor-rs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-rs
  labels:
    app.kubernetes.io/name: ingestor-rs
    app.kubernetes.io/component: ingestor
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.ingestor.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor-rs
        app.kubernetes.io/component: ingestor
        app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      {{- with .Values.ingestor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingestor-rs
          image: "{{ .Values.ingestor.image.repository }}:{{ .Values.ingestor.image.tag }}"
          imagePullPolicy: {{ .Values.ingestor.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iot-platform-config
            - secretRef:
                name: iot-platform-secrets
          env:
            - name: METRICS_PORT
              value: "8081"
          resources:
            {{- toYaml .Values.ingestor.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
