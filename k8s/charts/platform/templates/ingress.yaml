{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-platform-ingress
  labels:
    app.kubernetes.io/name: iot-platform-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: {{ default "iot-energy-platform" .Values.global.partOf }}
    helm.sh/chart: {{ include "platform.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hosts }}
    {{- range .Values.ingress.hosts }}
    - {{- if .host }}
      host: {{ .host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-rs
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: api-rs
                port:
                  number: 8080
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: api-rs
                port:
                  number: 8080
          - path: /grpc
            pathType: Prefix
            backend:
              service:
                name: envoy
                port:
                  number: 10000
    {{- end }}
    {{- else }}
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: api-rs
                port:
                  number: 8080
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: api-rs
                port:
                  number: 8080
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: api-rs
                port:
                  number: 8080
          - path: /grpc
            pathType: Prefix
            backend:
              service:
                name: envoy
                port:
                  number: 10000
    {{- end }}
{{- end }}
