# Default values for platform Helm chart.
# Declare variables to be passed into templates.

global:
  partOf: iot-energy-platform
  storageClass: standard

nameOverride: ""
fullnameOverride: ""

# Default replica count for stateless services
replicaCount: 2

# Configuration Map settings
config:
  mqttBrokerHost: "mosquitto"
  mqttBrokerPort: "1883"
  mqttTopicFilter: "meazon/grid/+/meter/+/telemetry"
  mqttShareGroup: "ingest"
  kafkaBrokers: "kafka:9092"
  kafkaTelemetryTopic: "iot.telemetry.raw"
  kafkaAlertsTopic: "iot.alerts"
  kafkaGroupIdPersister: "iot-persister-group"
  kafkaGroupIdAnomaly: "iot-anomaly-group"
  timescaleHost: "timescaledb"
  timescalePort: "5432"
  timescaleUser: "postgres"
  timescaleDb: "iot_energy"
  mongoHost: "mongo"
  mongoPort: "27017"
  mongoUser: "mongo_admin"
  mongoDb: "iot_twins"
  prometheusPort: "9090"
  grafanaPort: "3000"
  apiPort: "8088"
  logLevel: "info"
  simulatorMeters: "500"
  simulatorRate: "1"

# Secrets settings
secrets:
  postgresUser: "postgres"
  postgresPassword: "postgres"
  postgresDb: "iot_energy"
  mongoInitRootUser: "mongo_admin"
  mongoInitRootPassword: "mongo_password"
  mongoUser: "mongo_admin"
  mongoPassword: "mongo_password"
  mongoDb: "iot_twins"

# Microservices
ingestor:
  replicaCount: 2
  image:
    repository: iot-platform/ingestor-rs
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
  affinity: {}

persister:
  replicaCount: 2
  image:
    repository: iot-platform/persister-rs
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity: {}

anomalyWorker:
  replicaCount: 2
  image:
    repository: iot-platform/anomaly-worker-py
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPU: 70
  affinity: {}

api:
  replicaCount: 2
  image:
    repository: iot-platform/api-rs
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity: {}

envoy:
  replicaCount: 2
  image:
    repository: envoyproxy/envoy
    tag: v1.30.1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity: {}
  service:
    type: ClusterIP
    grpcPort: 10000
    adminPort: 9901

# Stateful Services
persistence:
  enabled: true
  storageClass: standard
  size: 10Gi

timescaledb:
  image:
    repository: timescale/timescaledb
    tag: latest-pg16
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi

kafka:
  image:
    repository: confluentinc/cp-kafka
    tag: 7.5.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi
  initTopics:
    enabled: true

mongo:
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi

mosquitto:
  image:
    repository: eclipse-mosquitto
    tag: "2.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodePort: 31883
  persistence:
    enabled: true
    storageClass: standard
    size: 10Gi

# Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts: []

# Prometheus Operator ServiceMonitors
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels:
    release: prometheus
