# 01-configs-secrets.yaml: Configuration and secrets for the IoT Smart-Energy Platform
apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-platform-config
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: iot-platform-config
    app.kubernetes.io/part-of: iot-energy-platform
data:
  # MQTT Settings
  MQTT_BROKER_HOST: "mosquitto"
  MQTT_BROKER_PORT: "1883"
  MQTT_TOPIC_FILTER: "meazon/grid/+/meter/+/telemetry"
  MQTT_SHARE_GROUP: "ingest"

  # Kafka Settings
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TELEMETRY_TOPIC: "iot.telemetry.raw"
  KAFKA_ALERTS_TOPIC: "iot.alerts"
  KAFKA_GROUP_ID_PERSISTER: "iot-persister-group"
  KAFKA_GROUP_ID_ANOMALY: "iot-anomaly-group"

  # TimescaleDB Settings
  TIMESCALE_HOST: "timescaledb"
  TIMESCALE_PORT: "5432"
  TIMESCALE_USER: "postgres"
  TIMESCALE_DB: "iot_energy"

  # MongoDB Settings
  MONGO_HOST: "mongo"
  MONGO_PORT: "27017"
  MONGO_USER: "mongo_admin"
  MONGO_DB: "iot_twins"

  # Observability & Service Ports
  PROMETHEUS_PORT: "9090"
  GRAFANA_PORT: "3000"
  API_PORT: "8088"

  # Service Settings
  LOG_LEVEL: "info"
  SIMULATOR_METERS: "500"
  SIMULATOR_RATE: "1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: timescaledb-init
    app.kubernetes.io/part-of: iot-energy-platform
data:
  01_init_timescale.sql: |
    -- 01_init_timescale.sql: TimescaleDB schema initialization for IoT Energy Platform

    CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

    -- 1. Base telemetry hypertable
    CREATE TABLE IF NOT EXISTS meter_readings (
        time                TIMESTAMPTZ       NOT NULL,
        meter_id            VARCHAR(64)       NOT NULL,
        voltage_l1          DOUBLE PRECISION  NOT NULL,
        voltage_l2          DOUBLE PRECISION  NOT NULL,
        voltage_l3          DOUBLE PRECISION  NOT NULL,
        current_l1          DOUBLE PRECISION  NOT NULL,
        current_l2          DOUBLE PRECISION  NOT NULL,
        current_l3          DOUBLE PRECISION  NOT NULL,
        active_power_kw     DOUBLE PRECISION  NOT NULL,
        energy_kwh          DOUBLE PRECISION  NOT NULL,
        power_factor        DOUBLE PRECISION  NOT NULL,
        frequency_hz        DOUBLE PRECISION  NOT NULL,
        CONSTRAINT pk_meter_readings PRIMARY KEY (meter_id, time)
    );

    -- Partition into 1-day chunks
    SELECT create_hypertable(
        'meter_readings',
        'time',
        chunk_time_interval => INTERVAL '1 day',
        if_not_exists => TRUE
    );

    -- Compound index for fast per-meter time-series retrieval
    CREATE INDEX IF NOT EXISTS idx_meter_readings_meter_time 
        ON meter_readings (meter_id, time DESC);

    -- 2. Continuous Aggregate: 1-Minute Rollup
    CREATE MATERIALIZED VIEW IF NOT EXISTS one_minute_consumption_rollup
    WITH (timescaledb.continuous) AS
    SELECT
        time_bucket('1 minute', time)   AS bucket,
        meter_id,
        AVG(active_power_kw)            AS avg_active_power_kw,
        MAX(active_power_kw)            AS max_active_power_kw,
        MIN(active_power_kw)            AS min_active_power_kw,
        AVG(power_factor)               AS avg_power_factor,
        AVG(voltage_l1)                 AS avg_voltage_l1,
        COUNT(*)                        AS reading_count
    FROM meter_readings
    GROUP BY bucket, meter_id
    WITH NO DATA;

    -- 3. Continuous Aggregate: 1-Hour Rollup (with delta energy kWh)
    CREATE MATERIALIZED VIEW IF NOT EXISTS hourly_consumption_rollup
    WITH (timescaledb.continuous) AS
    SELECT
        time_bucket('1 hour', time)     AS bucket,
        meter_id,
        AVG(active_power_kw)            AS avg_active_power_kw,
        MAX(active_power_kw)            AS max_active_power_kw,
        MIN(active_power_kw)            AS min_active_power_kw,
        MAX(energy_kwh) - MIN(energy_kwh) AS delta_energy_kwh,
        AVG(power_factor)               AS avg_power_factor,
        AVG(voltage_l1)                 AS avg_voltage_l1,
        COUNT(*)                        AS reading_count
    FROM meter_readings
    GROUP BY bucket, meter_id
    WITH NO DATA;

    -- 4. Continuous Aggregate: 1-Day Rollup
    CREATE MATERIALIZED VIEW IF NOT EXISTS daily_consumption_rollup
    WITH (timescaledb.continuous) AS
    SELECT
        time_bucket('1 day', time)      AS bucket,
        meter_id,
        AVG(active_power_kw)            AS avg_active_power_kw,
        MAX(active_power_kw)            AS max_active_power_kw,
        MAX(energy_kwh) - MIN(energy_kwh) AS delta_energy_kwh,
        AVG(power_factor)               AS avg_power_factor,
        COUNT(*)                        AS reading_count
    FROM meter_readings
    GROUP BY bucket, meter_id
    WITH NO DATA;

    -- 5. Continuous Aggregate Refresh Policies
    SELECT add_continuous_aggregate_policy('one_minute_consumption_rollup',
        start_offset => INTERVAL '2 hours',
        end_offset   => INTERVAL '1 minute',
        schedule_interval => INTERVAL '1 minute',
        if_not_exists => TRUE);

    SELECT add_continuous_aggregate_policy('hourly_consumption_rollup',
        start_offset => INTERVAL '3 days',
        end_offset   => INTERVAL '1 hour',
        schedule_interval => INTERVAL '10 minutes',
        if_not_exists => TRUE);

    SELECT add_continuous_aggregate_policy('daily_consumption_rollup',
        start_offset => INTERVAL '30 days',
        end_offset   => INTERVAL '1 day',
        schedule_interval => INTERVAL '1 hour',
        if_not_exists => TRUE);

    -- 6. Columnar Compression Policy (compress chunks older than 7 days)
    ALTER TABLE meter_readings SET (
        timescaledb.compress,
        timescaledb.compress_segmentby = 'meter_id',
        timescaledb.compress_orderby = 'time DESC'
    );

    SELECT add_compression_policy('meter_readings', INTERVAL '7 days', if_not_exists => TRUE);

    -- 7. Data Retention Policy (drop chunks older than 90 days)
    SELECT add_retention_policy('meter_readings', INTERVAL '90 days', if_not_exists => TRUE);

    -- 8. Anomaly Alerts Table (with unique constraint for idempotent writes)
    CREATE TABLE IF NOT EXISTS meter_alerts (
        id                  BIGSERIAL,
        time                TIMESTAMPTZ       NOT NULL,
        meter_id            VARCHAR(64)       NOT NULL,
        alert_type          VARCHAR(64)       NOT NULL,
        severity            VARCHAR(32)       NOT NULL,
        value               DOUBLE PRECISION  NOT NULL,
        threshold           DOUBLE PRECISION  NOT NULL,
        message             TEXT,
        created_at          TIMESTAMPTZ       DEFAULT NOW(),
        CONSTRAINT uq_meter_alert UNIQUE (meter_id, alert_type, time)
    );

    CREATE INDEX IF NOT EXISTS idx_meter_alerts_lookup 
        ON meter_alerts (severity, time DESC);

    CREATE INDEX IF NOT EXISTS idx_meter_alerts_meter_time 
        ON meter_alerts (meter_id, time DESC);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: mongo-init
    app.kubernetes.io/part-of: iot-energy-platform
data:
  init-mongo.js: |
    // init-mongo.js: Seeds 500 device twin documents for smart meters

    db = db.getSiblingDB('iot_twins');

    // Ensure unique index on meter_id
    db.device_twins.createIndex({ "meter_id": 1 }, { unique: true });
    db.device_twins.createIndex({ "zone": 1 });
    db.device_twins.createIndex({ "status": 1 });

    const zones = ["north", "south", "east", "west"];
    const firmwareVersions = ["v2.3.0", "v2.4.1", "v2.5.0-rc2"];
    const twins = [];

    for (let i = 1; i <= 500; i++) {
        const padId = String(i).padStart(4, '0');
        const meterId = `MZ-3P-${padId}`;
        const zone = zones[i % zones.length];
        const fw = firmwareVersions[i % firmwareVersions.length];
        
        // Athens base coordinates with slight jitter per device
        const lat = 37.9838 + ((i % 50) * 0.002) - 0.05;
        const lon = 23.7275 + (Math.floor(i / 50) * 0.003) - 0.05;
        
        twins.push({
            meter_id: meterId,
            firmware_version: fw,
            zone: zone,
            phase_type: "3P+N",
            nominal_voltage: 230.0,
            nominal_frequency: 50.0,
            thresholds: {
                voltage_min: 207.0,
                voltage_max: 253.0,
                active_power_kw_max: 25.0,
                power_factor_min: 0.85
            },
            location: {
                lat: parseFloat(lat.toFixed(5)),
                lon: parseFloat(lon.toFixed(5))
            },
            installed_at: new Date(Date.now() - (i * 86400000 * 2)),
            status: "ACTIVE"
        });
    }

    // Bulk insert
    db.device_twins.insertMany(twins);
    print(`[init-mongo] Successfully seeded ${twins.length} device twins into iot_twins.device_twins`);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: mosquitto-config
    app.kubernetes.io/part-of: iot-energy-platform
data:
  mosquitto.conf: |
    # Eclipse Mosquitto Configuration
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type all
    max_queued_messages 100000
    max_inflight_messages 2000
---
apiVersion: v1
kind: Secret
metadata:
  name: iot-platform-secrets
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: iot-platform-secrets
    app.kubernetes.io/part-of: iot-energy-platform
type: Opaque
stringData:
  postgres_password: "postgres"
  mongo_password: "mongo_password"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "iot_energy"
  DATABASE_URL: "postgres://postgres:postgres@timescaledb:5432/iot_energy"
  MONGO_INITDB_ROOT_USERNAME: "mongo_admin"
  MONGO_INITDB_ROOT_PASSWORD: "mongo_password"
  MONGO_USER: "mongo_admin"
  MONGO_PASSWORD: "mongo_password"
  MONGO_DB: "iot_twins"
  MONGO_URI: "mongodb://mongo_admin:mongo_password@mongo:27017/iot_twins?authSource=admin"
