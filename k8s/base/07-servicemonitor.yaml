# 07-servicemonitor.yaml: Prometheus Operator ServiceMonitors
# Configures Prometheus Operator to scrape metrics from microservices every 15s.

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingestor-rs-monitor
  namespace: iot-platform
  labels:
    release: prometheus
    app.kubernetes.io/name: ingestor-rs
    app.kubernetes.io/part-of: iot-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor-rs
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

