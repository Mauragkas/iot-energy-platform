# ==============================================================================
# Streaming Anomaly Detection Worker: anomaly-worker-py
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-worker-py
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: anomaly-worker-py
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: iot-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: anomaly-worker-py
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anomaly-worker-py
        app.kubernetes.io/component: analytics
        app.kubernetes.io/part-of: iot-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: anomaly-worker-py
          image: iot-platform/anomaly-worker-py:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iot-config
                optional: true
            - configMapRef:
                name: iot-platform-config
                optional: true
            - secretRef:
                name: iot-platform-secrets
                optional: true
          env:
            - name: METRICS_PORT
              value: "8083"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: "/tmp/pycache"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /metrics
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-worker-py
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: anomaly-worker-py
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: iot-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anomaly-worker-py
  ports:
    - name: metrics
      port: 8083
      targetPort: 8083
      protocol: TCP

