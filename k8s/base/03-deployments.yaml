# 03-deployments.yaml: Microservice Deployments & Companion Services
# Enforces non-root security context, explicit resource requests/limits, and health probes.

---
# ==============================================================================
# Ingestion Bridge: ingestor-rs
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor-rs
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: ingestor-rs
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: iot-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestor-rs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestor-rs
        app.kubernetes.io/component: ingestion
        app.kubernetes.io/part-of: iot-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingestor-rs
          image: iot-platform/ingestor-rs:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iot-config
                optional: true
            - configMapRef:
                name: iot-platform-config
                optional: true
            - secretRef:
                name: iot-platform-secrets
                optional: true
          env:
            - name: METRICS_PORT
              value: "8081"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor-rs
  namespace: iot-platform
  labels:
    app.kubernetes.io/name: ingestor-rs
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: iot-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ingestor-rs
  ports:
    - name: metrics
      port: 8081
      targetPort: 8081
      protocol: TCP

