name: CI Pipeline

# Automatic CI runs paused due to account hosting/billing limits.
# Can be manually triggered from the Actions UI via workflow_dispatch.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for native builds
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libssl-dev zlib1g-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check Python linting
        run: uv run ruff check .

      - name: Check Python formatting
        run: uv run ruff format --check .

  test-suites:
    name: Test Suites
    runs-on: ubuntu-24.04
    needs: lint-and-format
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies for native builds
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libssl-dev zlib1g-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Rust workspace test suite
        run: cargo test --workspace --verbose

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create Python venv and install dependencies
        run: |
          uv venv
          uv pip install -r simulator/requirements.txt -r services/anomaly-worker-py/requirements.txt

      - name: Run Python test suite
        run: uv run pytest -v

  helm-and-k8s:
    name: Helm & Kubernetes Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Lint Helm chart
        run: helm lint k8s/charts/platform

      - name: Template dev profile
        run: helm template test-dev k8s/charts/platform -f k8s/charts/platform/values-dev.yaml

      - name: Template prod profile
        run: helm template test-prod k8s/charts/platform -f k8s/charts/platform/values-prod.yaml

      - name: Validate Kubernetes base manifests
        run: kubectl apply --dry-run=client -f k8s/base/00-namespace.yaml -f k8s/base/01-configs-secrets.yaml -f k8s/base/02-stateful-storage.yaml -f k8s/base/03-deployments.yaml -f k8s/base/04-envoy-grpc-lb.yaml -f k8s/base/05-hpa.yaml -f k8s/base/06-ingress.yaml

  docker-build-check:
    name: Docker Build Check (${{ matrix.context }})
    runs-on: ubuntu-24.04
    needs: [test-suites, helm-and-k8s]
    strategy:
      fail-fast: false
      matrix:
        context:
          - services/ingestor-rs
          - services/persister-rs
          - services/anomaly-worker-py
          - services/api-rs
          - simulator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t test-image ${{ matrix.context }}
