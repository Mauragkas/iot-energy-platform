global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "ingestor-rs"
    static_configs:
      - targets: ["ingestor:8081"]

  - job_name: "persister-rs"
    static_configs:
      - targets: ["persister:8082"]

  - job_name: "anomaly-worker-py"
    static_configs:
      - targets: ["anomaly-worker:8083"]

  - job_name: "api-rs"
    static_configs:
      - targets: ["api:8080"]
