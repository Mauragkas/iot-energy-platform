[project]
name = "anomaly-worker"
version = "0.1.0"
description = "Real-Time Streaming Anomaly Worker for IoT Energy Platform"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.3.0",
    "prometheus-client>=0.20.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
